name: Android Prod

on:
    push:
        tags:
            - 'v*'

jobs:
    android:
        uses: ./.github/workflows/_android-build.yml
        with:
            environment_name: Production
            build_command: ./gradlew assembleRelease
            expected_firebase_project_id: ark-drop-prod
            run_ktlint: true
            run_lint: true
            use_keystore: true
            upload_artifact: true
            artifact_name: ark-drop-android-prod
            artifact_path: ./composeApp/build/outputs/apk/release/composeApp-release.apk
            lint_artifact_name: android-prod-lint-results
        secrets: inherit
